[package]
name = "soundveil"
description = "Offline live captions for Windows and Linux, with its interface in Slint."
version = "0.1.1"
edition = "2024"
license = "MIT"

[features]
# GPU recognition on Windows and Linux. The Vulkan SDK must be installed to build it.
vulkan = ["soundveil-whisper/vulkan"]
# Lets a run save a picture of the window, for checking the interface without a person.
snapshot = ["dep:png"]

[dependencies]
global-hotkey = "0.9"
hound = "3"
png = { version = "0.18", optional = true }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.18", features = ["unstable-winit-030"] }
soundveil-core = { path = "../core/soundveil-core" }
soundveil-whisper = { path = "../core/soundveil-whisper" }
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
pollster = "0.4"
libpulse-binding = "2"
libpulse-simple-binding = "2"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
